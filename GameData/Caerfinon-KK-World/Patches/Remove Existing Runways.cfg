// Module Manager Patch for NavInstruments
// This patch deletes all Runway node definitions from the defaultRunways.cfg

@NavutilitiesUpdatedPluginDatadefaultRunways:NEEDS[NavInstruments]:AFTER[NavInstruments]
{
    !Runway,* {}
}


// Module Manager Patch for Kramax Auto Pilot
// This patch deletes all flightplan node definitions from the DefaultFlightPlans.cfg
@KramaxAutoPilotPlansDefault:NEEDS[KramaxAutoPilot]:AFTER[KramaxAutoPilot]
{
	@Kerbin
	{
        !FlightPlan,* {}
	}
}


